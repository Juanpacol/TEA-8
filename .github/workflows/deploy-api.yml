name: Deploy api

on:
  push:
    branches: [main]
    paths:
      - "api/**"
      - ".github/workflows/deploy-api.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: tea-8-hackathon
  REGION: us-central1
  SERVICE: tea-api
  IMAGE: us-central1-docker.pkg.dev/tea-8-hackathon/tea-api/api

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/540884130312/locations/global/workloadIdentityPools/github/providers/github-oidc
          service_account: gh-deployer@tea-8-hackathon.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      - name: Build and push image
        run: |
          docker build -t "$IMAGE:${{ github.sha }}" api
          docker push "$IMAGE:${{ github.sha }}"

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy "$SERVICE" \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --image "$IMAGE:${{ github.sha }}" \
            --allow-unauthenticated \
            --set-secrets META_MODEL_API_KEY=meta-model-api-key:latest \
            --max-instances 1 \
            --min-instances 0 \
            --cpu 1 \
            --memory 256Mi \
            --concurrency 20 \
            --timeout 30

      - name: Smoke test
        run: |
          URL=$(gcloud run services describe "$SERVICE" --project "$PROJECT_ID" --region "$REGION" --format='value(status.url)')
          curl --fail --silent --show-error --max-time 30 "$URL/health"
